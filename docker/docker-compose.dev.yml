name: paperclip-dev

services:
  paperclip-dev:
    image: "${PAPERCLIP_DEV_IMAGE:-paperclip-local:main}"
    ports:
      - "${PAPERCLIP_PORT:-3100}:3100"
    environment:
      HOST: "0.0.0.0"
      PORT: "3100"
      NODE_ENV: "development"
      PAPERCLIP_HOME: "/paperclip"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-local-dev-change-me-please-32chars}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      CHOKIDAR_USEPOLLING: "${CHOKIDAR_USEPOLLING:-true}"
      WATCHPACK_POLLING: "${WATCHPACK_POLLING:-true}"
    volumes:
      - "${PAPERCLIP_DATA_DIR:-../data/docker-paperclip}:/paperclip"
      - "${OBSIDIAN_LOCAL_DEV_VAULT_DIR:-E:/Cloud/Personal/110_Local Dev}:/vaults/local-dev"
      - "../package.json:/app/package.json:ro"
      - "../pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro"
      - "../tsconfig.base.json:/app/tsconfig.base.json:ro"
      - "../tsconfig.json:/app/tsconfig.json:ro"
      - "../vitest.config.ts:/app/vitest.config.ts:ro"
      - "../cli/src:/app/cli/src"
      - "../scripts:/app/scripts"
      - "../server/src:/app/server/src"
      - "../ui/src:/app/ui/src"
      - "../packages/adapter-utils/src:/app/packages/adapter-utils/src"
      - "../packages/adapters/claude-local/src:/app/packages/adapters/claude-local/src"
      - "../packages/adapters/codex-local/src:/app/packages/adapters/codex-local/src"
      - "../packages/adapters/cursor-local/src:/app/packages/adapters/cursor-local/src"
      - "../packages/adapters/gemini-local/src:/app/packages/adapters/gemini-local/src"
      - "../packages/adapters/openclaw-gateway/src:/app/packages/adapters/openclaw-gateway/src"
      - "../packages/adapters/opencode-local/src:/app/packages/adapters/opencode-local/src"
      - "../packages/adapters/pi-local/src:/app/packages/adapters/pi-local/src"
      - "../packages/db/src:/app/packages/db/src"
      - "../packages/mcp-server/src:/app/packages/mcp-server/src"
      - "../packages/plugins/sdk/src:/app/packages/plugins/sdk/src"
      - "../packages/plugins/create-paperclip-plugin/src:/app/packages/plugins/create-paperclip-plugin/src"
      - "../packages/plugins/paperclip-plugin-fake-sandbox/src:/app/packages/plugins/paperclip-plugin-fake-sandbox/src"
      - "../packages/shared/src:/app/packages/shared/src"
      - "../skills:/app/skills"
      - "../.agents:/app/.agents"
    command:
      - "sh"
      - "-lc"
      - "rm -f /paperclip/instances/default/runtime-services/paperclip-dev-*.json; exec pnpm dev --bind lan"
